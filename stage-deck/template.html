<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deck title</title>
<!--
  STAGE DECK TEMPLATE. Copy this file, then replace: the palette and fonts in
  :root, MODE and STEPS (the two intake answers), the COVERAGE ledger, and
  every beat in BEATS. The four beats here show the layouts; their words say
  what goes in each place. Keep the machinery at the bottom as it is.

  Names this file already uses. Do not reuse them for something else:
    CSS classes  rail seg nav stage top claim desc body basis foot slot meta
                 lead detail plane pending annotated pwrap pip notes points
                 fig figrow
    JS globals   MODE STEPS IMG BEATS FOOT_SLOT pos stage rail
  Never name a helper `top`, `window`, `document` or `location`. The browser
  owns those names, and the clash stops the whole script with an error that
  points somewhere else ("BEATS is not defined").
-->
<style>
  :root{
    /* PLACEHOLDER PALETTE. Replace with the brand's. No colour literal may
       appear outside :root and html.dark. */
    --paper:#F7F7F4; --ink:#14171F; --dim:#515868;
    --surface:#FFFFFF; --line:#CDD1DA; --accent:#2456D6; --bad:#C2502F;
    --blackout:#000;
    --hair:color-mix(in srgb,var(--ink) 16%,transparent);
    --faint:color-mix(in srgb,var(--ink) 44%,transparent);
    --ghost:color-mix(in srgb,var(--ink) 10%,transparent);
    --fill:color-mix(in srgb,var(--ink) 30%,transparent);
    --field:color-mix(in srgb,var(--ink) 4%,var(--paper));
    --tint:color-mix(in srgb,var(--accent) 12%,transparent);
    --gap-item:1.1vh; --gap-block:3.2vh; --col-gap:4vw;
    --radius:.75rem; --radius-sm:calc(var(--radius) - 6px);
    --claim-top:5.5vh; --foot-h:5.5vh; --basis-h:5.5vh;
    --edge-l:12vh; --edge-r:7vw;
    --headline:4.2vh; --desc:2.3vh; --lead:2.9vh; --detail:2.1vh;
    --hair-weight:1px;
    --font-sans:system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  html.dark{
    --paper:#0E1118; --ink:#ECEEF3; --dim:#9AA2B4;
    --surface:#181C26; --line:#333A4A; --accent:#7FA4FF; --bad:#F08A66;
    --hair:color-mix(in srgb,var(--ink) 14%,transparent);
    --faint:color-mix(in srgb,var(--ink) 40%,transparent);
    --ghost:color-mix(in srgb,var(--ink) 9%,transparent);
    --field:color-mix(in srgb,var(--ink) 8%,var(--paper));
    --tint:color-mix(in srgb,var(--accent) 16%,transparent);
  }
  /* a presented deck has a shorter, larger headline and may have no description */
  html[data-mode="presented"]{ --headline:5.8vh; }

  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);
       height:100dvh;font-size:var(--detail)}
  *{box-sizing:border-box}

  /* ---- stage anatomy: headline, description, body, evidence note, foot ---- */
  .stage{position:relative;height:100dvh;padding:0 var(--edge-r) 0 var(--edge-l);
         display:grid;grid-template-rows:auto 1fr auto auto}
  .stage > *{min-height:0}
  .top{padding-top:var(--claim-top)}
  .claim{margin:0;font-size:var(--headline);line-height:1.22;font-weight:700;
         max-width:62ch;letter-spacing:-0.01em;text-wrap:balance}
  html[data-mode="presented"] .claim{max-width:32ch}
  .desc{margin:1.6vh 0 0;font-size:var(--desc);line-height:1.5;color:var(--dim);
        max-width:110ch;text-wrap:pretty}
  .body{display:flex;flex-direction:column;justify-content:center;
        padding:2.4vh 0 2vh;position:relative}
  .body > *{flex-shrink:0}
  .basis{font-family:var(--font-mono);font-size:1.6vh;line-height:1.7;
         color:var(--dim);height:var(--basis-h);display:flex;align-items:center}
  .foot{height:var(--foot-h);display:flex;align-items:center;grid-row:4;
        justify-content:space-between;border-top:var(--hair-weight) solid var(--hair)}
  .foot .slot,.meta{font-family:var(--font-mono);font-size:1.6vh;letter-spacing:.14em;
        text-transform:uppercase;color:var(--dim)}
  .lead{font-size:var(--lead);line-height:1.45;max-width:44ch;text-wrap:balance}
  .detail{font-size:var(--detail);line-height:1.5;max-width:52ch;color:var(--dim);
          text-wrap:pretty}

  /* ---- title slide ---- */
  .stage[data-archetype="statement"] .top{padding-top:31vh}
  .stage[data-archetype="statement"] .claim{font-size:9vh;line-height:1.14;
         max-width:24ch;margin:0 auto;text-align:center}
  .stage[data-archetype="statement"] .body{justify-content:flex-start;
         align-items:center;text-align:center}
  .stage[data-archetype="statement"] .lead{max-width:none;margin:0}
  .stage[data-archetype="statement"] .meta{margin-top:var(--gap-block)}

  /* ---- tracker: one equal segment per slide, the current one filled ---- */
  .rail{position:fixed;left:calc(var(--edge-l)/2 - .25vh);top:50%;
        translate:0 -50%;display:flex;flex-direction:column;gap:.7vh;z-index:5}
  .rail .seg{width:.5vh;height:1.6vh;background:var(--hair);position:relative;
        overflow:hidden}
  .rail .seg i{position:absolute;left:0;top:0;width:100%;background:var(--accent)}

  /* ---- click to move: left half goes back, right half goes forward ---- */
  .nav{position:fixed;top:0;bottom:0;width:50%;z-index:6;background:none;border:0;
       padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .nav.prev{left:0}
  .nav.next{right:0}
  .nav::after{content:"";position:absolute;top:50%;width:2.2vh;height:2.2vh;
       border-top:var(--hair-weight) solid var(--dim);
       border-right:var(--hair-weight) solid var(--dim);
       opacity:0;transition:opacity 200ms ease-out}
  .nav.prev::after{left:2.6vh;rotate:-135deg}
  .nav.next::after{right:2.6vh;rotate:45deg}
  .nav:hover::after{opacity:.7}
  .nav:focus{outline:0}

  /* ---- steps (only used when STEPS is true) ---- */
  [data-reveal]{opacity:0;translate:0 1.2vh;
      transition:opacity 300ms ease-out,translate 300ms ease-out}
  svg [data-reveal]{translate:0 0}   /* CSS lengths in SVG are user units */
  [data-reveal][data-shown="true"]{opacity:1;translate:0 0}
  .stage.retreat [data-reveal]{transition-duration:160ms}
  html.no-anim *{transition:none!important;animation:none!important}
  .beat-enter{animation:enter 260ms ease-out both}
  @keyframes enter{from{opacity:0;translate:0 1.2vh}to{opacity:1;translate:0 0}}
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}}

  /* ---- figures: full width of the measure, capped in height ---- */
  .fig{margin-block:auto}
  .fig svg,.figrow svg{width:100%;height:auto;max-height:var(--figmax,56vh);display:block}
  .figrow{display:grid;grid-template-columns:1fr 26vw;gap:var(--col-gap);
          align-items:center;margin-block:auto}
  svg{overflow:visible}
  svg text{font-family:var(--font-sans);fill:var(--dim)}
  svg .strong{fill:var(--ink);font-weight:600}
  svg .tick{font-family:var(--font-mono);letter-spacing:.1em;text-transform:uppercase}

  /* ---- artifacts: the only bordered things. A missing one is a dashed
          placeholder that says what is needed ---- */
  .plane{border:var(--hair-weight) solid var(--line);border-radius:var(--radius-sm);
         background:var(--surface);overflow:hidden;aspect-ratio:16/10;width:100%}
  .plane img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
  .plane.pending{border-style:dashed;background:var(--ghost);display:flex;
         flex-direction:column;align-items:center;justify-content:center;
         gap:var(--gap-item);text-align:center;padding:var(--gap-block)}
  .plane.pending .detail{max-width:30ch}

  /* ---- an artifact with up to three numbered notes beside it ---- */
  .annotated{display:grid;grid-template-columns:1.5fr 1fr;gap:0 var(--col-gap);
             align-items:center;width:100%}
  .pwrap{position:relative}
  .pip{position:absolute;right:-1.5vh;translate:0 -50%;width:3vh;height:3vh;
       border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);
       color:var(--ink);display:grid;place-items:center;font-size:1.6vh;
       font-weight:600;line-height:1}
  .pip.static{position:static;translate:none;flex:none;margin-top:.3vh}
  .notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
         gap:var(--gap-block)}
  .notes li{display:flex;gap:1.4vh;align-items:flex-start}
  .notes p{margin:0;font-size:var(--detail);line-height:1.5;color:var(--dim);
           text-wrap:pretty}
  .notes b{color:var(--ink);font-weight:600}

  /* ---- a short list of points, each a statement with its reason ---- */
  .points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;
          gap:calc(var(--gap-block) * 1.4)}
  .points .lead{margin:0;font-weight:600;max-width:60ch}
  .points .detail{margin:var(--gap-item) 0 0;max-width:76ch}

  #blackout{position:fixed;inset:0;background:var(--blackout);z-index:50;
            opacity:0;pointer-events:none;transition:opacity 400ms ease-out}
  html.blackout #blackout{opacity:1}
</style>

<div class="rail" aria-hidden="true" id="rail"></div>
<main class="stage" aria-label="Presentation stage" data-archetype="" id="stage"></main>
<button class="nav prev" id="navPrev" aria-label="Previous slide" tabindex="-1"></button>
<button class="nav next" id="navNext" aria-label="Next slide" tabindex="-1"></button>
<div id="blackout" aria-hidden="true"></div>

<script>
/* The two intake answers (draft.md, Stage 0). */
const MODE  = "standalone";   // "standalone": read without a presenter. "presented": a live talk.
const STEPS = false;          // false: every slide shows complete, one click per slide.
                              // true: [data-reveal="1"], "2", ... land one click at a time.

/* COVERAGE  (source: <file>)
     <source claim>  ->  <beat id>   <what it carries>
     DROPPED: <what>  -  <why>
   Rewrite this to match the deck as built. */

/* Screenshots, as data URIs. An empty key draws a dashed placeholder. */
const IMG = { example:"" };

/* ---------- drawing helpers ----------
   A full-width figure uses a viewBox 340 units wide, so one unit is 1/340 of
   the measure. Strokes do not scale: 1px hairline for scaffold, 1.5px for
   paths. Label sizes: 5 to 6 for a name, 4 to 4.4 for a note, 3.6 for a tick. */
const SVG = (w,h,rel,label,inner) =>
  `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMid meet" data-relationship="${rel}" role="img" aria-label="${label}">${inner}</svg>`;
const stroke = (c,w=1.5) => `fill="none" stroke="${c}" stroke-width="${w}" vector-effect="non-scaling-stroke"`;
const hair = (x1,y1,x2,y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke("var(--hair)",1)}/>`;
const text = (x,y,s,o={}) =>
  `<text x="${x}" y="${y}" font-size="${o.size||4.2}" text-anchor="${o.anchor||"start"}" class="${o.cls||""}">${s}</text>`;
const label = (x,y,s,o={}) => text(x,y,s,{size:5,...o,cls:"strong"});
const tick  = (x,y,s,o={}) => text(x,y,s,{size:3.6,...o,cls:"tick"});
/* Several lines of one label. The pitch is 1.35 times the size, which is the
   least that keeps two lines from touching. Always use this for wrapped text. */
const lines = (x,y,rows,o={}) =>
  rows.map((s,i)=>text(x, +(y + i*(o.size||4.2)*1.35).toFixed(2), s, o)).join("");
/* An arrow ends in an open chevron at the weight of its line, never a filled wedge. */
const arrow = (x1,y1,x2,y2,c="var(--dim)") => {
  const a = Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke(c)}/>
    <polyline points="-2.6,-2.2 0,0 -2.6,2.2" transform="translate(${x2} ${y2}) rotate(${a})" ${stroke(c)}/>`;
};
const box = (x,y,w,h,o={}) =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx??1.6}" fill="${o.fill||"var(--surface)"}" stroke="${o.stroke||"var(--line)"}" stroke-width="${o.sw||1}" ${o.dash?`stroke-dasharray="${o.dash}"`:""} vector-effect="non-scaling-stroke"/>`;
/* One grammar, held across the deck: a person is a circle, a system is a square. */
const person = (x,y,r=2.8) => `<circle cx="${x}" cy="${y}" r="${r}" fill="var(--paper)" ${stroke("var(--ink)").replace('fill="none" ','')}/>`;
const system = (x,y,s=5.2) => `<rect x="${x-s/2}" y="${y-s/2}" width="${s}" height="${s}" fill="var(--ink)"/>`;
/* A real thing drawn small: one product screen, 46 by 30 units. Draw the
   deck's own things this way (its screens, files, messages, tools). */
const miniScreen = (x,y) => {
  const r = (a,b,w,h,f,rx=0) => `<rect x="${x+a}" y="${y+b}" width="${w}" height="${h}" rx="${rx}" fill="${f}"/>`;
  return box(x,y,46,30) + hair(x,y+3.6,x+46,y+3.6)
    + r(3,6,40,1.6,"var(--ghost)") + r(3,10,17,2,"var(--ink)") + r(3,14.5,25,12.5,"var(--ghost)",1)
    + r(5.5,17,17,1.2,"var(--faint)") + r(5.5,19.6,12,1.2,"var(--faint)") + r(5.5,22.6,10,2.6,"var(--dim)",1.3)
    + r(31,14.5,12,3.2,"var(--ghost)",.8) + r(31,19.1,12,3.2,"var(--ghost)",.8) + r(31,23.7,12,3.2,"var(--ghost)",.8);
};

/* A screenshot, or the placeholder that says which screenshot is needed. */
const shot = (key, artifact, need) => IMG[key]
  ? `<div class="plane" data-artifact="${artifact}"><img data-img="${key}" alt="${artifact}"></div>`
  : `<div class="plane pending" data-artifact="${artifact} (pending)">
       <span class="meta">Screenshot needed</span><span class="detail">${need}</span></div>`;

const header = (headline, description) =>
  `<header class="top"><h1 class="claim">${headline}</h1>${description?`<p class="desc">${description}</p>`:""}</header>`;
const figure = (svg, maxVh=56) => `<div class="body"><div class="fig" style="--figmax:${maxVh}vh">${svg}</div></div>`;

/* EXAMPLE ONLY. It shows the helpers and the emphasis rules, not a form to
   reuse: each slide's diagram takes the form its own argument has. */
function exampleFigure(){
  return SVG(340,100,"flow",
    "A person asks an agent for a change, the change passes a shared check, and the result arrives ready for review. Today each result differs.",
    `${person(6,30)}${label(14,28.4,"A person")}${text(14,34.6,"asks for a change")}
     ${arrow(60,30,88,30)}
     ${system(97,30)}${label(105,28.4,"An agent")}${text(105,34.6,"writes the code")}
     ${arrow(150,30,176,30,"var(--accent)")}
     ${box(180,8,88,44,{rx:2.6,fill:"var(--tint)",stroke:"var(--accent)",sw:1.5})}
     ${label(224,25,"The shared check",{anchor:"middle",size:6})}
     ${lines(224,33,["The recommended state is","the largest thing drawn."],{anchor:"middle"})}
     ${arrow(272,30,290,30,"var(--accent)")}
     ${miniScreen(294,15)}
     ${label(294,53.5,"Ready for review",{size:4.6})}
     ${tick(180,64,"What it checks")}
     ${hair(180,67,268,67)}${label(180,74,"A part of the real thing",{size:4.6})}${text(180,79.8,"named in the audience's own terms",{size:4})}
     ${hair(180,83.5,268,83.5)}${label(180,90.5,"A second part",{size:4.6})}${text(180,96.3,"with what it is, in a few words",{size:4})}
     <g opacity=".85">
       ${tick(0,64,"Today")}
       <circle cx="1.6" cy="72.4" r="1.6" fill="var(--bad)"/>
       ${lines(6,74,["Today's state is small and muted,","and it sits in one place."],{size:4})}
     </g>`);
}

const BEATS = [
  {
    id:"title", chapter:"Opening", archetype:"statement",
    render(){ return `
      <header class="top"><h1 class="claim">Deck title</h1></header>
      <div class="body">
        <p class="lead">What the deck covers, in a few words</p>
        <p class="meta">Author, date</p>
      </div>`; }
  },
  {
    id:"diagram", chapter:"Argument", archetype:"axis",
    basis:"Where the evidence comes from, in one line.",
    render(){ return `
      ${header("The headline states the point of the slide as one full sentence",
               "The description adds the reason or sets up the diagram, in one to three sentences. Nothing in it repeats the headline, and nothing in it describes what the diagram already shows.")}
      ${figure(exampleFigure())}`; }
  },
  {
    id:"artifact", chapter:"Argument", archetype:"stage",
    notes:[
      ["First detail.","What a reader should notice at mark 1, and why it matters."],
      ["Second detail.","Each note carries the consequence, which the picture cannot."],
      ["Third detail.","Three numbered notes is the most one artifact takes."],
    ],
    render(){ return `
      ${header("A real screenshot makes the case better than a drawing of one",
               "Use the artifact itself when it exists. Until it is supplied, the placeholder holds its place and says exactly which capture is needed.")}
      <div class="body"><div class="annotated">
        <div class="pwrap">
          ${shot("example","Screenshot: the product screen under discussion","The product screen under discussion, at full width")}
          <span class="pip" style="top:24%">1</span><span class="pip" style="top:50%">2</span><span class="pip" style="top:76%">3</span>
        </div>
        <ol class="notes" data-reveal="1">
          ${this.notes.map((n,i)=>`<li><span class="pip static">${i+1}</span><p><b>${n[0]}</b> ${n[1]}</p></li>`).join("")}
        </ol>
      </div></div>`; }
  },
  {
    id:"points", chapter:"Close", archetype:"list",
    points:[
      ["The first point, as a full sentence.","The reason for it, or what it changes, in one or two sentences of plain wording."],
      ["The second point, in the same form.","Parallel points take the same shape and about the same length."],
      ["The third point.","A closing slide makes no request the conversation is meant to carry."],
    ],
    render(){ return `
      ${header("A closing slide names what should happen next")}
      <div class="body"><ol class="points">
        ${this.points.map(p=>`<li data-reveal="1"><p class="lead">${p[0]}</p><p class="detail">${p[1]}</p></li>`).join("")}
      </ol></div>`; }
  },
];

const FOOT_SLOT = "";   // one deck-level string: a client name, a date, a confidentiality mark

/* ---------- machinery: leave as it is ---------- */

document.documentElement.dataset.mode = MODE;
const stage = document.getElementById("stage");
const rail  = document.getElementById("rail");
let pos = { beat:0, reveal:0 };       // the synchronous source of truth
let renderedBeat = -1;

/* The step count is derived from what the beat renders, never written by hand. */
const counts = new Map();
function revealCount(b){
  if(!STEPS) return 0;
  if(!counts.has(b.id)){
    const t = document.createElement("template");
    t.innerHTML = b.render();
    counts.set(b.id, Math.max(0, ...[...t.content.querySelectorAll("[data-reveal]")]
      .map(el => parseInt(el.dataset.reveal, 10) || 0)));
  }
  return counts.get(b.id);
}

function clamp(bi, r){
  bi = Math.max(0, Math.min(BEATS.length - 1, bi|0));
  r  = Math.max(0, Math.min(revealCount(BEATS[bi]), r|0));
  return { beat:bi, reveal:r };
}

function commit(bi, r){
  const back = bi < pos.beat || (bi === pos.beat && r < pos.reveal);
  pos = clamp(bi, r);
  render(back);
  try{
    history.replaceState(null, "",
      `?beat=${encodeURIComponent(BEATS[pos.beat].id)}&r=${pos.reveal}`);
  }catch(e){}
}

function render(back){
  const b = BEATS[pos.beat];
  const count = `${String(pos.beat+1).padStart(2,"0")} / ${String(BEATS.length).padStart(2,"0")}`;
  stage.classList.toggle("retreat", !!back);
  if(renderedBeat !== pos.beat){
    stage.dataset.archetype = b.archetype;
    stage.innerHTML =
      b.render()
      + (b.basis ? `<div class="basis">${b.basis}</div>` : "")
      + `<div class="foot" aria-hidden="true">
           <span class="slot">${pos.beat === 0 ? "Click the right half, or press →, to advance" : FOOT_SLOT}</span>
           <span class="slot">${count}</span>
         </div>`;
    stage.querySelectorAll("img[data-img]").forEach(el=>{ el.src = IMG[el.dataset.img]; });
    stage.classList.remove("beat-enter");
    void stage.offsetWidth;             // synchronous reflow, never rAF-gated
    stage.classList.add("beat-enter");
    renderedBeat = pos.beat;
  }
  stage.querySelectorAll("[data-reveal]").forEach(el=>{
    el.dataset.shown = String(!STEPS || (parseInt(el.dataset.reveal, 10) || 0) <= pos.reveal);
  });
  rail.innerHTML = BEATS.map((x,i)=>{
    const total = revealCount(x);
    const frac = i !== pos.beat ? 0 : (pos.reveal + 1) / (total + 1);
    return `<span class="seg">${frac ? `<i style="height:${Math.round(frac*100)}%"></i>` : ""}</span>`;
  }).join("");
}

function advance(){
  if(pos.reveal < revealCount(BEATS[pos.beat])) commit(pos.beat, pos.reveal+1);
  else if(pos.beat < BEATS.length-1) commit(pos.beat+1, 0);
}
function retreat(){
  if(pos.reveal > 0) commit(pos.beat, pos.reveal-1);
  else if(pos.beat > 0) commit(pos.beat-1, revealCount(BEATS[pos.beat-1]));
}

addEventListener("keydown", e=>{
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  const k = e.key, c = e.code;
  if(k === "ArrowRight" || k === " " || c === "Space" || c === "PageDown" || k === "PageDown"){
    e.preventDefault(); advance();
  }else if(k === "ArrowLeft" || c === "PageUp" || k === "PageUp"){
    e.preventDefault(); retreat();
  }else if(k === "Home"){ e.preventDefault(); commit(0,0);
  }else if(k === "End"){ e.preventDefault();
    commit(BEATS.length-1, revealCount(BEATS[BEATS.length-1]));
  }else if(c === "KeyB"){
    document.documentElement.classList.toggle("blackout");
  }else if(c === "KeyT"){
    const dark = document.documentElement.classList.toggle("dark");
    try{ localStorage.setItem("deck-theme", dark ? "dark" : "light"); }catch(e){}
  }
});

document.getElementById("navNext").addEventListener("click", advance);
document.getElementById("navPrev").addEventListener("click", retreat);

document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden){
    document.documentElement.classList.add("no-anim");
    render(false);
    void stage.offsetWidth;
    document.documentElement.classList.remove("no-anim");
  }
});

(function init(){
  let theme = null;
  try{ theme = localStorage.getItem("deck-theme"); }catch(e){}
  if(theme === "dark" ||
     (theme === null && matchMedia("(prefers-color-scheme: dark)").matches)){
    document.documentElement.classList.add("dark");
  }
  let bi = 0, r = 0;
  try{
    const p = new URLSearchParams(location.search);
    const found = BEATS.findIndex(x => x.id === p.get("beat"));
    if(found >= 0){ bi = found; r = parseInt(p.get("r")||"0", 10) || 0; }
  }catch(e){}
  commit(bi, r);
})();
</script>
</html>
